# Paratiritirio monthly data refresh
# On the 8th of every month, GitHub runs basecamp/paratiritirio/tools/update_pulse.py,
# which reads Eurostat, the ECB Data Portal (incl. Central Bank of Cyprus series)
# and CYSTAT, and rewrites basecamp/paratiritirio/pulse-data.js. It commits only
# when a figure changed. To check it ran: the repo's Actions tab → "Paratiritirio
# monthly data" (green tick = ran fine). "Run workflow" there runs it by hand.
# Figures with no API live in pulse-snapshot.js and are updated by hand.
name: Paratiritirio monthly data

on:
  schedule:
    - cron: "41 5 8 * *"     # 05:41 UTC on the 8th of each month
  workflow_dispatch:          # the "Run workflow" button

permissions:
  contents: write             # needed to commit pulse-data.js
  pages: write                # needed to ask GitHub Pages to rebuild

concurrency:
  group: paratiritirio-pulse
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the latest figures
        run: python3 basecamp/paratiritirio/tools/update_pulse.py

      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet -- basecamp/paratiritirio/pulse-data.js; then
            echo "No new figures."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add basecamp/paratiritirio/pulse-data.js
          git commit -m "Paratiritirio: monthly data update"
          git push
          echo "changed=yes" >> "$GITHUB_OUTPUT"

      # Commits made by a workflow may not start a Pages build on their own,
      # so ask for one (only when the data changed).
      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
