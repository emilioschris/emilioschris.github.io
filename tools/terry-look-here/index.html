    .hk-line { stroke: var(--hawk-line); stroke-linejoin: round; stroke-linecap: round; }
    .hk-band { fill: none; stroke: var(--hawk-band); stroke-linecap: round; }

    .gate { width: 100%; max-width: 360px; border: 1px solid var(--rule); background: var(--panel); border-radius: 4px; }
    .gate-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--rule); }
    .gate-hawk { height: 40px; width: auto; flex: none; overflow: visible; }
    .gate-title { margin: 0; font: 600 12px/1 "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.14em; text-transform: uppercase; }

    .gate-sub { margin: 4px 0 0; font: 400 11px/1.3 "JetBrains Mono", ui-monospace, monospace; color: var(--label); }
    form { padding: 16px; }
    label.pw { display: block; font: 500 10px/1 "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.1em; text-transform: uppercase; color: var(--label); margin-bottom: 6px; }
    .pw-row { display: flex; gap: 6px; }

      width: 100%; margin-top: 14px; padding: 11px; cursor: pointer;
      background: var(--accent); color: #140C08; border: 0; border-radius: 3px;
      font: 600 12px/1 "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.14em; text-transform: uppercase;

    .err { margin: 10px 0 0; min-height: 1.4em; font: 400 12px/1.4 "JetBrains Mono", ui-monospace, monospace; color: var(--down); }
    .loading { font: 400 12px/1 "JetBrains Mono", ui-monospace, monospace; color: var(--label); letter-spacing: 0.1em; }
    .cursor { display: inline-block; width: 7px; height: 12px; background: var(--accent); vertical-align: -1px; animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
