<body class="fr-page">

  <a class="skip-link" href="#main">Skip to the technologies</a>

  <!-- ================= TOP BAR ================= -->

      <img class="back-hawk" src="../../favicon.svg" alt="" width="30" height="30">
      <span class="wordmark-text">
        <span class="wordmark-title"><span aria-hidden="true">← </span>Field Notes</span>

      </span>

    <div class="bar-tools">
      <button class="theme-switch" id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Dusk mode">

  <dialog class="fr-gate" id="fr-gate" aria-labelledby="fr-gate-title" aria-describedby="fr-gate-text">
    <p class="fr-gate-tag">Work in progress</p>
    <h2 class="fr-gate-title" id="fr-gate-title">Frontier isn't finished yet</h2>
    <p class="fr-gate-text" id="fr-gate-text">All four technologies are now charted, but the stock ticker isn't live yet and some details are still being checked.</p>

      <button class="btn btn--solid" type="button" data-gate-ok autofocus>Got it, take a look</button>
      <a class="btn" href="../../index.html#base-camp">Back to Base Camp</a>
    </div>
  </dialog>

  <footer class="fr-foot fr-wrap">
    <p class="fr-credit" id="fr-credits"></p>
  </footer>
