<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course Records · Field Notes</title>
  <meta name="description" content="A race tracker: every finish line, hung on a rail in order, with times, paces and the shape of each course.">
  <meta name="theme-color" content="#F2EBDD">

  <!-- Link preview (WhatsApp, iMessage, social apps) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://emilioschris.github.io/library/races/">
  <meta property="og:title" content="Course Records · Field Notes">
  <meta property="og:description" content="A race tracker: every finish line, hung on a rail in order, with times, paces and the shape of each course.">
  <meta property="og:image" content="https://emilioschris.github.io/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A red-tailed hawk with a terracotta tail perched on a branch over faint contour lines, beside the words Field Notes and the coordinates 35.1°N 33.4°E.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://emilioschris.github.io/og-image.png">
  <meta name="twitter:image:alt" content="A red-tailed hawk with a terracotta tail perched on a branch over faint contour lines, beside the words Field Notes and the coordinates 35.1°N 33.4°E.">

  <!-- Same Day/Dusk choice as the homepage, applied before the page draws -->
  <script src="../../shared/theme-init.js?v=2026-10-14.1"></script>

  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..600&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Instrument+Sans:wght@400..600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- The shared design system, then Course Records' own styles -->
  <link rel="stylesheet" href="../../shared/field-notes.css?v=2026-10-14.1">
  <link rel="stylesheet" href="styles.css?v=2026-10-14.1">
</head>
<body class="races-page">

  <a class="skip-link" href="#rail">Skip to the medals</a>

  <!-- ================= TOP BAR ================= -->
  <header class="bar is-scrolled">
    <a class="wordmark back-link" href="../../index.html#library">
      <img class="back-hawk" src="../../favicon.svg" alt="" width="30" height="30">
      <span class="wordmark-text">
        <span class="wordmark-title"><span aria-hidden="true">← </span>Field Notes</span>
        <span class="wordmark-owner">Back to the homepage</span>
      </span>
    </a>

    <div class="bar-tools">
      <button class="theme-switch" id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Dusk mode">
        <span class="theme-label" aria-hidden="true">Day</span>
        <span class="theme-track" aria-hidden="true"><span class="theme-dot"></span></span>
        <span class="theme-label" aria-hidden="true">Dusk</span>
      </button>
    </div>
  </header>

  <main id="main" class="races">

    <!-- ================= TITLE ================= -->
    <header class="races-head">
      <p class="races-eyebrow">The Library · N 076°</p>
      <h1 class="races-title">Course <em>Records</em></h1>
      <p class="races-lede">Every finish line so far, hung on the rail in the order I crossed them. Pick a medal to open its page in the journal.</p>
    </header>

    <!-- ================= RECORDS STRIP (filled in from data.js) ================= -->
    <section class="records" aria-labelledby="records-title">
      <h2 class="visually-hidden" id="records-title">Records</h2>
      <dl class="records-list" id="records"></dl>
    </section>

    <!-- ================= THE MEDAL RAIL ================= -->
    <section class="rail-wrap" aria-labelledby="rail-title">
      <h2 class="rail-title" id="rail-title">The medal rail</h2>
      <div class="rail" id="rail" tabindex="-1">
        <ol class="rail-track" id="rail-track"></ol>
      </div>
    </section>
  </main>

  <!-- ================= RACE PANEL (a journal page) ================= -->
  <aside class="panel" id="panel" role="dialog" aria-labelledby="panel-title" aria-hidden="true" hidden>
    <div class="panel-scroll">
      <button class="btn panel-close" id="panel-close" type="button">Close <span aria-hidden="true">✕</span></button>
      <div id="panel-body"></div>
    </div>
  </aside>

  <!-- The shared script, your races, then the page itself -->
  <script src="../../shared/field-notes.js?v=2026-10-14.1"></script>
  <script src="data.js?v=2026-10-14.1"></script>
  <script src="script.js?v=2026-10-14.1"></script>
</body>
</html>
